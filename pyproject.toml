[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "rlecosystem"
version = "0.1.0"
description = "Watch blue and red agents learn to eat and hunt with reinforcement learning."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "torch==2.14.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
